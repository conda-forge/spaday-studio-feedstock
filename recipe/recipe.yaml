context:
  version: "0.2.0"
  python_min: "3.11"

package:
  name: spaday-studio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-studio/spaday_studio-${{ version }}.tar.gz
  sha256: cf32143039ac7430a3a2d6e9f9b39a85a6901a68e417bdd49a4f825b6f67cabd

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - mcp >=2,<3
    - pydantic >=2
    - spaday >=0.7,<1.0
    - starlette
    - transports >=0.8,<0.9

tests:
  - python:
      imports:
        - spaday_studio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: AI-native visual development environment for spaday
  homepage: https://github.com/1kbgz/spaday-studio
  repository: https://github.com/1kbgz/spaday-studio

extra:
  recipe-maintainers:
    - timkpaine
