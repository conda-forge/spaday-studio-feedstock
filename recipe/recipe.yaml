context:
  version: "0.3.0"

package:
  name: spaday-studio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-studio/spaday_studio-${{ version }}.tar.gz
  sha256: bacfbb7a06939355e793c75129a9d1f4cbdb01749bde14f91dfd811b7ecf9ce1

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - mcp >=2,<3
    - pydantic >=2
    - spaday >=0.11.4,<1.0
    - spaday-codemirror >=0.2,<0.3
    - starlette
    - transports >=0.10,<0.11

tests:
  - python:
      imports:
        - spaday_studio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: AI-native visual development environment for spaday
  homepage: https://github.com/1kbgz/spaday-studio
  repository: https://github.com/1kbgz/spaday-studio

extra:
  recipe-maintainers:
    - timkpaine
